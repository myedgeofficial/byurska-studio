name: Statistika – diagnoza

# Ročni pregled, ali se REMAKO statistika osvežuje: čas zadnjega zbiranja, napake virov, stanje urnika in zadnji dnevniki.
# Repo je javen, zato izpiše samo čase in napake, nikoli številk (obiski, prihodki).
on:
  workflow_dispatch:
    inputs:
      zazeni:
        description: "Zaženi zbiranje zdaj (statistikaZberi)"
        type: boolean
        default: false

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    env:
      P: ${{ vars.FIREBASE_PROJECT || 'byurska-studio' }}
    steps:
      - name: Prijava
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
      - name: Urnik
        run: |
          gcloud scheduler jobs list --project "$P" --location europe-west1 --format='table(name.basename(),schedule,state,lastAttemptTime,status.code)' || true
          if [ "${{ inputs.zazeni }}" = "true" ]; then
            J=$(gcloud scheduler jobs list --project "$P" --location europe-west1 --format='value(name.basename())' | grep -i statistikazberi | head -1)
            gcloud scheduler jobs run "$J" --project "$P" --location europe-west1 && sleep 150
          fi
      - name: Stanje v bazi (samo časi in napake)
        run: |
          T=$(gcloud auth print-access-token)
          for d in skupno myedge remako nakupko byurska; do
            curl -sS -H "Authorization: Bearer $T" "https://firestore.googleapis.com/v1/projects/$P/databases/(default)/documents/stat-povzetek/$d" | python3 -c "
          import json,sys,datetime
          d=json.load(sys.stdin); f=d.get('fields',{})
          ts=lambda v: datetime.datetime.fromtimestamp(int(v)/1000).isoformat() if v else None
          o=f.get('osvezeno',{}).get('integerValue')
          dni=sorted((f.get('dnevi',{}).get('mapValue',{}).get('fields') or {}).keys())
          nap={k:v.get('stringValue','')[:200] for k,v in (f.get('napake',{}).get('mapValue',{}).get('fields') or {}).items()}
          g=f.get('gsc',{}).get('mapValue',{}).get('fields',{})
          print('$d', 'osvezeno', ts(o), '| zadnji dan', dni[-1:] , '| polja', sorted(f.keys()), '| napake', nap, '| gsc napaka', g.get('napaka',{}).get('stringValue'))
          "
          done
      - name: Zadetki števca (zadnji 2 uri, samo stran, vrsta naprave, status)
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="stevec" AND logName:"run.googleapis.com%2Frequests"' \
            --project "$P" --freshness=2h --limit 2000 --format=json | python3 -c "
          import json,sys,collections,urllib.parse
          c=collections.Counter()
          for e in json.load(sys.stdin):
            r=e.get('httpRequest',{}); ua=r.get('userAgent','')
            naprava='iPhone' if 'iPhone' in ua else 'Android' if 'Android' in ua else 'drugo'
            c[(e['timestamp'][11:15]+'0', urllib.parse.urlparse(r.get('referer','')).hostname, naprava, r.get('requestMethod'), r.get('status'))]+=1
          for k,v in sorted(c.items()): print(k, v)
          "
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="stevec" AND severity>=WARNING' --project "$P" --freshness=6h --limit 10 --format='value(timestamp,textPayload)' | cut -c1-300 || true
      - name: Dnevniki funkcij (zadnja ura)
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND (resource.labels.service_name="statistikazberi" OR resource.labels.service_name="statistikaosvezi") AND (severity>=WARNING OR textPayload:"statistika zbrana")' \
            --project "$P" --freshness=3h --limit 30 --format='value(timestamp,severity,resource.labels.service_name,textPayload)' | cut -c1-400 || true
