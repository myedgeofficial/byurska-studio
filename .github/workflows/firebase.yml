name: Strežnik (Firebase)

# Pripravi Firebase projekt (spletna aplikacija, baza v EU, prijava z e-pošto, shramba za vsebino)
# in objavi pravila dostopa (samo ekipa). Potrebna skrivnost: FIREBASE_SERVICE_ACCOUNT (JSON, vloga Owner).
# Spremenljivka FIREBASE_PROJECT (privzeto byurska-studio).
on:
  push:
    branches: [main]
    paths: ["firebase/**", ".github/workflows/firebase.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    env:
      P: ${{ vars.FIREBASE_PROJECT || 'byurska-studio' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preveri skrivnost
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::warning::Manjka skrivnost FIREBASE_SERVICE_ACCOUNT, objava preskočena."; echo "ok=no" >> "$GITHUB_OUTPUT"; else echo "ok=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Pripravi projekt in objavi pravila
        if: steps.check.outputs.ok == 'yes'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          TOKEN=$(gcloud auth print-access-token)
          api() { curl -sS -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $P" -H "Content-Type: application/json" "$@"; }
          FB="npx --yes firebase-tools@14 --project $P --non-interactive"

          echo "::group::Storitve"
          gcloud services enable firestore.googleapis.com identitytoolkit.googleapis.com firebasestorage.googleapis.com storage.googleapis.com firebaserules.googleapis.com --project "$P" || true
          echo "::endgroup::"

          echo "::group::Spletna aplikacija in baza"
          if ! $FB apps:list WEB --json | grep -q '"appId"'; then $FB apps:create WEB "Byurska"; fi
          $FB firestore:databases:list --json | grep -q '(default)' || $FB firestore:databases:create "(default)" --location eur3 || true
          echo "::endgroup::"

          echo "::group::Prijava z e-pošto in geslom"
          R=$(api -X PATCH "https://identitytoolkit.googleapis.com/admin/v2/projects/$P/config?updateMask=signIn.email.enabled,signIn.email.passwordRequired" \
              -d '{"signIn":{"email":{"enabled":true,"passwordRequired":true}}}')
          if echo "$R" | grep -q '"error"'; then
            echo "$R" | head -c 600
            echo "::warning::Prijave z e-pošto ni bilo mogoče vklopiti samodejno. V Firebase konzoli: Authentication › Get started › Email/Password › Enable."
          else echo "Prijava z e-pošto je vklopljena."; fi
          echo "::endgroup::"

          echo "::group::Shramba za vsebino"
          B=$(api "https://firebasestorage.googleapis.com/v1beta/projects/$P/buckets" | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('buckets') or [{}])[0].get('name','').split('/')[-1])" 2>/dev/null || true)
          if [ -z "$B" ]; then
            R=$(api -X POST "https://firebasestorage.googleapis.com/v1alpha/projects/$P/defaultBucket" -d '{"location":"EUROPE-WEST1","storageClass":"STANDARD"}')
            echo "$R" | head -c 600; echo
            B=$(echo "$R" | python3 -c "import json,sys; print(json.load(sys.stdin).get('bucket',{}).get('name','').split('/')[-1])" 2>/dev/null || true)
          fi
          if [ -z "$B" ]; then
            echo "::error::Shramba še ni ustvarjena. V Firebase konzoli: Storage › Get started (lokacija europe-west1), nato zaženi ta workflow znova."
            exit 1
          fi
          echo "Shramba: $B"
          # Pravila shrambe preverjajo seznam članov v Firestore: shrambi dovolimo branje baze.
          NUM=$(gcloud projects describe "$P" --format='value(projectNumber)')
          gcloud projects add-iam-policy-binding "$P" --member="serviceAccount:service-$NUM@gcp-sa-firebasestorage.iam.gserviceaccount.com" \
            --role=roles/firebaserules.firestoreServiceAgent --condition=None --quiet > /dev/null \
            && echo "Shramba lahko preverja člane." || echo "::warning::Pravice za preverjanje članov v shrambi ni bilo mogoče dodati."
          echo "::endgroup::"

          $FB deploy --only firestore,storage --force

          echo "::group::Opomniki za objave (funkcija ob 9:00 in 18:00)"
          if [ -n "$APNS_KEY_P8" ] && [ -n "$APNS_KEY_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            gcloud services enable cloudfunctions.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com run.googleapis.com \
              eventarc.googleapis.com pubsub.googleapis.com cloudscheduler.googleapis.com cloudbilling.googleapis.com --project "$P" || true
            cp ../web/src/data.js functions/data.js
            B64=$(python3 -c "import os,re,textwrap; r=os.environ['APNS_KEY_P8'].replace('\\\\n','\\n'); b=re.sub(r'-----(BEGIN|END)[A-Z ]*-----','',r); b=re.sub(r'[^A-Za-z0-9+/=]','',b); import base64; print(base64.b64encode(('-----BEGIN PRIVATE KEY-----\\n'+'\\n'.join(textwrap.wrap(b,64))+'\\n-----END PRIVATE KEY-----\\n').encode()).decode())")
            printf 'APNS_KEY_ID=%s\nAPNS_TEAM_ID=%s\nAPNS_KEY_B64=%s\n' "$APNS_KEY_ID" "$APPLE_TEAM_ID" "$B64" > functions/.env
            (cd functions && npm install --no-audit --no-fund --silent)
            # Prva objava funkcije 2. generacije včasih pade, dokler Google ne pripravi storitev: poskusimo še enkrat.
            $FB deploy --only functions --force || { sleep 90; $FB deploy --only functions --force; }
            rm -f functions/.env
          else
            echo "::warning::Manjkajo skrivnosti APNS_KEY_P8, APNS_KEY_ID ali APPLE_TEAM_ID, funkcija za opomnike ni objavljena."
          fi
          echo "::endgroup::"
          rm -f "$RUNNER_TEMP/sa.json"
