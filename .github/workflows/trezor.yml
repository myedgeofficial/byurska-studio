name: REMAKO trezor

# Zasebni trezor za gesla in podatke REMAKO d.o.o.: https://remako-trezor.web.app
# Vsebina je šifrirana v brskalniku s kodo, v Firestore (projekt byurska-studio) gre samo šifrirano besedilo.
# Objavi stran (ločena Firebase Hosting stran) in pravila baze, ki zaklenejo zbirko »trezor«.
on:
  push:
    branches: [main, claude/project-thread-8f8pkn]
    paths: ["trezor/**", "firebase/firestore.rules", "firebase/storage.rules", ".github/workflows/trezor.yml"]
  workflow_dispatch:

concurrency:
  group: trezor
  cancel-in-progress: true

jobs:
  objavi:
    runs-on: ubuntu-latest
    env:
      P: ${{ vars.FIREBASE_PROJECT || 'byurska-studio' }}
      STRAN: remako-trezor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preizkusi šifriranje
        working-directory: trezor
        run: npm install --no-audit --no-fund && npm test

      - name: Zgradi in objavi
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Manjka skrivnost FIREBASE_SERVICE_ACCOUNT."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          FB="npx --yes firebase-tools@14 --project $P --non-interactive"

          # Najprej pravila: zbirka »trezor« ni dostopna članom Studia, seznam ni dovoljen nikomur.
          (cd firebase && $FB deploy --only firestore:rules,storage --force)

          # Priponke se v brskalniku berejo neposredno iz shrambe: dovolimo branje s strani trezorja (CORS).
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          B="gs://$P.firebasestorage.app"
          gcloud storage buckets describe "$B" --format='json(cors_config)' > "$RUNNER_TEMP/cors-zdaj.json" || echo '{}' > "$RUNNER_TEMP/cors-zdaj.json"
          python3 - "$RUNNER_TEMP/cors-zdaj.json" "$RUNNER_TEMP/cors.json" "https://$STRAN.web.app" "https://${{ vars.TREZOR_DOMENA || 'banka.remako.si' }}" <<'PY'
          import json, sys
          zdaj = (json.load(open(sys.argv[1])) or {}).get("cors_config") or []
          izvor = sys.argv[3]
          if not any(izvor in (p.get("origin") or []) for p in zdaj):
              zdaj.append({"origin": [izvor, "https://" + izvor.split("//")[1].replace(".web.app", ".firebaseapp.com")], "method": ["GET"], "maxAgeSeconds": 3600, "responseHeader": ["Content-Type"]})
          for p in zdaj:
              if izvor in (p.get("origin") or []) and sys.argv[4] not in p["origin"]:
                  p["origin"].append(sys.argv[4])
          json.dump(zdaj, open(sys.argv[2], "w"))
          print("CORS:", json.dumps(zdaj))
          PY
          gcloud storage buckets update "$B" --cors-file="$RUNNER_TEMP/cors.json"

          export FB_CONFIG=$($FB apps:sdkconfig WEB --json | python3 app/scripts/fb-config.py "$P.firebasestorage.app")
          (cd trezor && npm run build)
          $FB hosting:sites:get "$STRAN" > /dev/null 2>&1 || $FB hosting:sites:create "$STRAN"
          (cd trezor && $FB deploy --only hosting --force)

          # Lastna domena (npr. banka.remako.si): dodamo jo strani in izpišemo DNS zapise, ki jih je treba vpisati v FreeDNS.
          DOMENA="${{ vars.TREZOR_DOMENA || 'banka.remako.si' }}"
          TOK=$(gcloud auth print-access-token)
          API="https://firebasehosting.googleapis.com/v1beta1/projects/$P/sites/$STRAN/customDomains"
          curl -s -o /dev/null -w "Dodajanje domene: HTTP %{http_code}\n" -X POST -H "Authorization: Bearer $TOK" -H "Content-Type: application/json" -d '{}' "$API?customDomainId=$DOMENA" || true
          curl -s -H "Authorization: Bearer $TOK" "$API/$DOMENA" > "$RUNNER_TEMP/domena.json" || true
          python3 - "$RUNNER_TEMP/domena.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print("Domena:", d.get("name", "?").split("/")[-1], "| stanje:", d.get("hostState"), "| lastništvo:", d.get("ownershipState"), "| certifikat:", (d.get("cert") or {}).get("state"))
          for skupina in ("requiredDnsUpdates",):
              for zbirka in (d.get(skupina) or {}).get("desired", []):
                  for z in zbirka.get("records", []):
                      print("ZAPIS:", zbirka.get("domainName"), z.get("type"), z.get("rdata"), "->", z.get("requiredAction", "ADD"))
          if d.get("error"): print("NAPAKA:", json.dumps(d["error"]))
          PY
          # Google prijava: stran in domena morata biti med dovoljenimi domenami za Firebase Auth.
          IDT="https://identitytoolkit.googleapis.com/admin/v2/projects/$P/config"
          curl -s -H "Authorization: Bearer $TOK" -H "x-goog-user-project: $P" "$IDT" > "$RUNNER_TEMP/auth.json" || true
          if python3 - "$RUNNER_TEMP/auth.json" "$RUNNER_TEMP/auth-novo.json" "$STRAN.web.app" "$STRAN.firebaseapp.com" "$DOMENA" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          dom = d.get("authorizedDomains")
          # Brez obstoječega seznama ne pišemo, da ne izbrišemo domen drugih aplikacij (Studio).
          if not dom: print("Domen za prijavo ni bilo mogoče prebrati:", json.dumps(d)[:300]); sys.exit(1)
          for x in sys.argv[3:]:
              if x not in dom: dom.append(x)
          json.dump({"authorizedDomains": dom}, open(sys.argv[2], "w"))
          print("Dovoljene domene za prijavo:", ", ".join(dom))
          PY
          then
            curl -s -o /dev/null -w "Posodobitev domen za prijavo: HTTP %{http_code}\n" -X PATCH -H "Authorization: Bearer $TOK" -H "x-goog-user-project: $P" -H "Content-Type: application/json" \
              -d @"$RUNNER_TEMP/auth-novo.json" "$IDT?updateMask=authorizedDomains" || true
          fi
          # Koda 2FA (TOTP, Google Authenticator): vklopimo na projektu (potrebna je nadgradnja na Identity Platform).
          curl -s -o "$RUNNER_TEMP/mfa.json" -w "Vklop TOTP 2FA: HTTP %{http_code}\n" -X PATCH -H "Authorization: Bearer $TOK" -H "x-goog-user-project: $P" -H "Content-Type: application/json" \
            -d '{"mfa":{"providerConfigs":[{"state":"ENABLED","totpProviderConfig":{"adjacentIntervals":5}}]}}' "$IDT?updateMask=mfa.providerConfigs" || true
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("2FA:", json.dumps(d.get("mfa") or d.get("error"))[:400])' "$RUNNER_TEMP/mfa.json" || true
          rm -f "$RUNNER_TEMP/sa.json"

          # Preveri, da spletni ključ deluje z novega naslova (ključ je lahko omejen na znane strani).
          KEY=$(printf '%s' "$FB_CONFIG" | python3 -c 'import json,sys;print(json.load(sys.stdin)["apiKey"])')
          ID=$(python3 -c 'print("0"*64)')
          # Nova pravila začnejo veljati v približno minuti.
          for i in 1 2 3 4 5 6 7 8; do
            K=$(curl -s -o /tmp/odg.json -w '%{http_code}' -H "Referer: https://$STRAN.web.app/" \
              "https://firestore.googleapis.com/v1/projects/$P/databases/(default)/documents/trezor/$ID?key=$KEY")
            [ "$K" = "403" ] && break
            sleep 15
          done
          echo "Preizkus baze brez prijave: HTTP $K (pričakovano 403 = brez Google prijave Teo/Tim ni dostopa)"
          [ "$K" = "403" ] || { cat /tmp/odg.json; echo "::warning::Baza z naslova $STRAN.web.app ne odgovarja pravilno."; }
          S=$(curl -s -o /dev/null -w '%{http_code}' "https://$STRAN.web.app/")
          echo "Stran: HTTP $S"
          echo "Objavljeno: https://$STRAN.web.app"
