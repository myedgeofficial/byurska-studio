name: iOS aplikacija

# PR: preveri, da se aplikacija zgradi (brez podpisa).
# main ali ročni zagon: zgradi, podpiše in naloži na TestFlight.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["firebase/**", ".github/workflows/firebase.yml", ".github/workflows/testerji.yml", ".github/workflows/nove-aplikacije.yml", ".github/scripts/**", "README.md"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.byurska.studio' }}
      FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT || 'byurska-studio' }}
      HAS_SECRETS: ${{ secrets.APPSTORE_KEY_P8 != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Preizkusi pomožne funkcije (opomniki, šifriranje gesel)
        working-directory: web
        run: TZ=Europe/Ljubljana node --test tests/*.test.js

      - name: Nastavitve strežnika (Firebase)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::warning::Manjka skrivnost FIREBASE_SERVICE_ACCOUNT: aplikacija ne bo povezana s strežnikom."; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          CFG=$(npx --yes firebase-tools@14 --project "$FIREBASE_PROJECT" --non-interactive apps:sdkconfig WEB --json | python3 scripts/fb-config.py "$FIREBASE_PROJECT.firebasestorage.app")
          echo "STUDIO_FB_CONFIG=$CFG" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Pripravi spletni del in Capacitor
        run: |
          npm ci
          npm run sync

      - name: Preizkusna gradnja (brez podpisa)
        if: github.event_name == 'pull_request' || env.HAS_SECRETS != 'true'
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            STUDIO_BUNDLE_ID="$BUNDLE_ID" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -n 15 | sed 's/^/::error::/'; tail -n 80 "$RUNNER_TEMP/build.log"; exit 65; }
          tail -n 20 "$RUNNER_TEMP/build.log"
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::notice::Za TestFlight dodaj skrivnosti APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 in APPLE_TEAM_ID (glej README.md)."
          fi

      - name: Zgradi, podpiši in naloži na TestFlight
        if: github.event_name != 'pull_request' && env.HAS_SECRETS == 'true'
        working-directory: app/ios/App
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          python3 - "$KEY_PATH" <<'PY'
          import os, re, sys, textwrap
          raw = os.environ["KEY_P8"].replace("﻿", "").replace("\\n", "\n")
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          if len(body) < 100:
              sys.exit("::error::APPSTORE_KEY_P8 je prazen ali prekratek. Prilepi celotno vsebino datoteke .p8.")
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem)
          PY
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          sed "s/TEAM_ID/$TEAM_ID/" ../../ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Byurska.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO \
            STUDIO_BUNDLE_ID="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tail -n 80

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Byurska.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 80

          rm -f "$KEY_PATH"
          echo "::notice::Gradnja $BUILD_NUMBER je naložena. Na TestFlightu bo vidna, ko jo Apple obdela (običajno 5–15 minut)."
